<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1e30">Clima Brasil — Arquitetura Física (Implantação)</text>

  <!-- Client -->
  <rect x="370" y="56" width="240" height="70" rx="10" fill="#e7e5fe" stroke="#796cbf" stroke-width="1.5"/>
  <text x="490" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2741">Cliente</text>
  <text x="490" y="103" text-anchor="middle" font-size="11.5" fill="#2b2741">Navegador — desktop, tablet ou</text>
  <text x="490" y="117" text-anchor="middle" font-size="11.5" fill="#2b2741">smartphone (layout responsivo)</text>

  <!-- Host Web -->
  <rect x="60" y="190" width="380" height="140" rx="12" fill="#eef2ff" stroke="#6c8bff" stroke-width="1.5"/>
  <text x="250" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1e30">Host — WeatherDashboard.Web</text>
  <rect x="82" y="230" width="336" height="40" rx="8" fill="#ffffff" stroke="#b5abfc"/>
  <text x="250" y="254" text-anchor="middle" font-size="12" fill="#2b2741">Kestrel + Razor Views</text>
  <text x="250" y="292" text-anchor="middle" font-size="11.5" fill="#2b2741">porta 5170 (http) / 7034 (https)</text>

  <!-- Host Api -->
  <rect x="560" y="190" width="380" height="230" rx="12" fill="#f5f0ff" stroke="#9184d9" stroke-width="1.5"/>
  <text x="750" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2741">Host — WeatherDashboard.Api</text>
  <rect x="582" y="230" width="336" height="36" rx="8" fill="#ffffff" stroke="#b5abfc"/>
  <text x="750" y="253" text-anchor="middle" font-size="12" fill="#2b2741">Kestrel + Controllers + Swagger UI</text>
  <rect x="582" y="274" width="336" height="36" rx="8" fill="#ffffff" stroke="#b5abfc"/>
  <text x="750" y="297" text-anchor="middle" font-size="12" fill="#2b2741">WeatherCollectorHostedService (thread bg)</text>
  <rect x="582" y="318" width="336" height="36" rx="8" fill="#ffffff" stroke="#b5abfc"/>
  <text x="750" y="341" text-anchor="middle" font-size="12" fill="#2b2741">EF Core InMemory — memória do processo</text>
  <text x="750" y="380" text-anchor="middle" font-size="11.5" fill="#2b2741">porta 5282 (http) / 7222 (https)</text>
  <text x="750" y="398" text-anchor="middle" font-size="11.5" fill="#2b2741">/swagger — documentação interativa</text>

  <!-- External -->
  <rect x="710" y="480" width="230" height="70" rx="10" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="825" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4043">OpenWeatherMap</text>
  <text x="825" y="528" text-anchor="middle" font-size="11.5" fill="#3c4043">REST API (serviço externo)</text>

  <!-- Arrows -->
  <line x1="440" y1="126" x2="280" y2="190" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="280" y="160" font-size="11.5" fill="#555555">HTML/CSS/JS</text>

  <line x1="540" y1="126" x2="720" y2="190" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="600" y="160" font-size="11.5" fill="#555555">fetch JSON (CORS)</text>

  <line x1="750" y1="420" x2="800" y2="480" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="710" y="460" font-size="11.5" fill="#555555">HTTPS, a cada 15 min</text>
  <text x="710" y="474" font-size="11.5" fill="#555555">55 chamadas (1/cidade)</text>

  <text x="60" y="580" font-size="11.5" fill="#777777">Os dois hosts podem ir para portas/domínios diferentes sem mudar código: Web lê a URL da API de</text>
  <text x="60" y="598" font-size="11.5" fill="#777777">WeatherApi:BaseUrlHttp(s); a Api aceita a origem do Web via Cors:AllowedOrigins.</text>
</svg>
